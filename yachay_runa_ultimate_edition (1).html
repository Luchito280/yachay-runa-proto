<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yachay Runa - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake-error { animation: shakeError 0.4s ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes shakeError { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* Mapas y Vistas */
        .map-viewport { overflow: hidden; cursor: grab; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .map-viewport:active { cursor: grabbing; }
        .map-content { touch-action: none; transition: transform 0.1s ease-out; }
        
        /* Tooltips para la Tienda */
        .tooltip-container:hover .tooltip { display: block; }
        .tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); z-index: 50; width: max-content; max-width: 200px; }

        /* Temas Pop Quiz Especiales */
        .theme-debugger { font-family: 'Fira Code', monospace; background-color: #020617; border: 2px solid #10b981; color: #34d399; }
        .theme-debugger h3 { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .theme-debugger .opt-btn { background-color: #064e3b; border-color: #047857; color: #a7f3d0; }
        
        .theme-boss { background: radial-gradient(circle at top, #450a0a 0%, #2e1065 100%); border: 3px solid #dc2626; }
        .theme-boss h3 { color: #fca5a5; font-weight: 800; text-transform: uppercase; }
        .theme-boss .opt-btn { background-color: #7f1d1d; border-color: #b91c1c; font-weight: bold; }
        
        .theme-speedrun { border-top: 5px solid #06b6d4; }
        
        .theme-gacha { background: linear-gradient(135deg, #422006 0%, #713f12 100%); border: 2px solid #eab308; }
        .theme-gacha .opt-btn { background: linear-gradient(to bottom, #ca8a04, #a16207); border-color: #facc15; }
        
        .theme-dialogue { background-color: #0f172a; }
        .chat-bubble { background-color: #1e293b; border-radius: 20px 20px 20px 0; border-left: 4px solid #3b82f6; }
        
        .timer-bar { transition: width 1s linear; }
    </style>
</head>

            startLevel(levelId) {
                this.currentLevel = levelId;
                this.correctCount = 0;
                
                let db = [...QuestionDB[levelId]];
                this.shuffle(db); // Real randomness
                
                let limit = levelId === 'popquiz' ? 10 : 8; // Pop Quiz limits strictly to 10!
                if(db.length > limit) db = db.slice(0, limit);
                
                this.missionQueue = db;
                this.totalQuestions = limit;
                this.showNextQuestion();

                else if (p.includes('[Speedrun]') || p.includes('[QTE]')) { themeClass = 'theme-speedrun'; isTimer = true; }
                else if (p.includes('[Gacha Pull]') || p.includes('[Easter Egg]')) { themeClass = 'theme-gacha'; }
                else if (p.includes('[Simulador de Diálogo]')) { themeClass = 'theme-dialogue'; extraUI = '<div class="text-xs mb-2 text-blue-400">WhatsApp - Nuevo Mensaje</div>'; }

                let qText = p.replace(/\[.*?\]\s*/g, '');
                let exitAction = this.currentLevel === 'popquiz' ? "App.showRegionSelector()" : "App.showMap(App.currentRegion)";

                        <div class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-3xl mx-auto overflow-y-auto">
                            ${extraUI}
                            <div class="${themeClass === 'theme-dialogue' ? 'chat-bubble p-6 mb-8 w-full' : 'bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl w-full text-center mb-8'}">
                                <h3 class="text-2xl font-bold ${themeClass === 'theme-dialogue' ? 'text-white' : ''}">${qText}</h3>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full" id="options-container">
                                ${this.shuffle([...q.options]).map(opt => `
                                    <button class="opt-btn bg-slate-700 hover:bg-slate-600 border-2 border-slate-600 rounded-xl text-lg py-5 px-4 text-white font-medium transition-transform hover:-translate-y-1 active:translate-y-0" data-val="${opt}">${opt}</button>
                                `).join('')}

                        </div>
                    </div>
                `;
                
                this.container.innerHTML = html;
                
                const btns = this.container.querySelectorAll('.opt-btn');
                btns.forEach(btn => btn.onclick = (e) => this.checkAnswer(e.currentTarget, e.currentTarget.dataset.val, q.correct));

                if(isTimer) {
                    let w = 100;
                    const tb = document.getElementById('timer-bar');
                    this.timerInterval = setInterval(() => {
                        w -= 10;
                        tb.style.width = w + '%';
                        if(w <= 30) tb.classList.add('bg-red-500');
                        if(w <= 0) {
                            clearInterval(this.timerInterval);
                            this.checkAnswer(null, 'TIMEOUT', q.correct);
                        }
                    }, 1000);
                }
            },
            
            checkAnswer(btnObj, selectedStr, correctStr) {
                clearInterval(this.timerInterval);
                const isCorrect = selectedStr === correctStr;
                const btns = this.container.querySelectorAll('.opt-btn');
                btns.forEach(b => { b.disabled = true; b.classList.add('opacity-50', 'pointer-events-none'); });
                
                const f = document.getElementById('feedback');
                const next = document.getElementById('btn-next');
                
                // Escudo protector: Si la vista ya se destruyó, detiene la función sin causar errores.
                if (!f || !next) return;
                
                f.classList.remove('hidden');
                next.classList.remove('hidden');
                
                if(isCorrect) {
                    if(btnObj) btnObj.className = "opt-btn bg-emerald-600 border-2 border-emerald-400 rounded-xl text-lg py-5 px-4 text-white font-medium scale-105 shadow-[0_0_20px_rgba(16,185,129,0.5)]";
                    
                    let starText = this.currentLevel === 'popquiz' ? '<span class="text-yellow-400 ml-2 animate-bounce inline-block text-xl">+2 ⭐</span>' : '';
                    f.innerHTML = `¡Respuesta Correcta! ✅ ${starText}`;
                    f.className = "mt-8 w-full text-center font-bold text-lg px-6 py-4 rounded-xl shadow-lg bg-emerald-900/40 text-emerald-400 border border-emerald-500 flex items-center justify-center pop-in";
                    
                    this.correctCount++;
                    this.missionQueue.shift(); 
                    
                    setTimeout(() => this.showNextQuestion(), 1200);
                } else {
                    if(btnObj) btnObj.className = "opt-btn bg-red-600 border-2 border-red-500 rounded-xl text-lg py-5 px-4 text-white font-medium shake-error";
                    f.innerHTML = `Incorrecto ❌<br><span class="text-sm font-normal text-slate-300 mt-2 block">La respuesta correcta era: <strong class="text-white">${correctStr}</strong></span>`;
                    f.className = "mt-8 w-full text-center font-bold text-lg px-6 py-4 rounded-xl shadow-lg bg-red-900/40 text-red-400 border border-red-500 block pop-in";
                    
                    const q = this.missionQueue.shift();
                    this.missionQueue.push(q); // Spaced Repetition -> Goes to back of queue
                    
                    next.onclick = () => this.showNextQuestion();
                }
            },
            
            showVictory() {
                let starsEarned = 0;
                
                if (this.currentLevel === 'popquiz') {
                    // Because they finished, correctCount always equals totalQuestions (10). 10 * 2 = 20 stars!
                    starsEarned = this.totalQuestions * 2; 
                } else {
                    starsEarned = 50;
                    GameState.unlockLevel(this.currentLevel);
                }
                
                GameState.stars += starsEarned;
                GameState.save();
                
                this.container.innerHTML = `

                        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-2 text-center relative z-10">¡Misión Completada!</h1>
                        <p class="text-slate-400 mb-8 relative z-10">Has dominado este nivel perfectamente.</p>
                        
                        <div class="bg-slate-800 p-6 rounded-2xl border border-yellow-500/30 mb-8 flex flex-col items-center shadow-[0_0_30px_rgba(234,179,8,0.2)] pop-in relative z-10 min-w-[200px]">
                            <span class="text-sm text-yellow-400/80 font-bold uppercase mb-2">Recompensa Obtenida</span>
                            <span class="text-5xl font-black text-yellow-400">+${starsEarned} ⭐</span>
                            ${this.currentLevel === 'popquiz' ? `<span class="text-xs text-slate-400 mt-2 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">${this.totalQuestions} aciertos x 2 estrellas</span>` : ''}
                        </div>
                        
                        <button id="btn-return" class="bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:scale-110 transition-transform relative z-10 text-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">
                            Continuar Aventura
                        </button>
                    </div>
                `;
                
                document.getElementById('btn-return').onclick = () => {
                    if(this.currentLevel === 'popquiz') this.showRegionSelector();
                    else this.showMap(this.currentRegion);
                };
            }
        };

        // Iniciar App
        App.init();
    </script>
</body>
</html>
